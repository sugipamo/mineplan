name: Release binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  preflight:
    name: Test release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: cargo fmt --check
      - name: Test mineplan
        run: cargo test

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MINEPLAN_BUILD_VERSION: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive: mineplan-linux-x86_64.tar.gz
            runner: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-gnu
            archive: mineplan-linux-aarch64.tar.gz
            runner: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            archive: mineplan-macos-x86_64.tar.gz
            runner: macos-15-intel
            cross: false
          - target: aarch64-apple-darwin
            archive: mineplan-macos-aarch64.tar.gz
            runner: macos-14
            cross: false
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        if: matrix.cross
        with:
          tool: cross
      - name: Build with cross
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}
      - name: Build natively
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package binary
        run: tar -czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release mineplan
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
