[package]
name = "memory_experiments"
version = "0.1.0"
edition = "2024"
publish = false

# Experiments are intentionally separate from the memory server project.
[workspace]

[dependencies]
dotenvy = "0.15"
memory_server = { package = "mineplan", path = ".." }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
